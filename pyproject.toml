[project]
name = "job-page-finder"
version = "0.1.0"
description = "A lightweight agent that finds job listing pages on company websites"
requires-python = ">=3.11,<4.0"
dependencies = [
    "browser-use",
    "pydantic>=2.12,<3",
    "python-dotenv>=1.2,<2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/job_page_finder"]

[tool.uv.sources]
browser-use = { path = "../browser-use", editable = true }

[dependency-groups]
dev = [
    "pytest>=9,<10",
    "pytest-asyncio>=1.3,<2",
    "ruff>=0.14,<0.15",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = ["integration: uses a real local browser against a static local site"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I"]
